<header [style.background-image]="'url(' + backGroundHeader + ')'">
  <section class="Navbar">
    <div id="logo-container">
      @if (logoSito$ | async; as logo) {
        <img
          id="logo"
          [src]="getOptimizedUrl(logo.publicId, 200)"
          [alt]="logo.title"
          [width]="logo.width"
          [height]="logo.height"
        />
      }
    </div>

    <div class="container-title">
      <h1>MY LENS</h1>
    </div>

    <div class="container-links">
      <nav class="main-links" aria-label="Navigazione principale">
        <a
          routerLink="/home"
          routerLinkActive="attivo"
          ariaCurrentWhenActive="page"
          >Home</a
        >
        <a
          routerLink="/gallery"
          routerLinkActive="attivo"
          ariaCurrentWhenActive="page"
          >Gallery</a
        >
        <a
          routerLink="/about-me"
          routerLinkActive="attivo"
          ariaCurrentWhenActive="page"
          >About Me</a
        >
      </nav>
    </div>
  </section>
  <p>
    "Fotografare la natura nella sua immensa bellezza è uno dei tanti modi per
    onorarla"
  </p>
</header>
